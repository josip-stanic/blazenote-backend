name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

[[routes]]
pattern = "blazenote-backend.enterprising-philosopher.sxplab.com"
custom_domain = true

# TODO: In-Workshop Activities. Uncomment the code below:
 
